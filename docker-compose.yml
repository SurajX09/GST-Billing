version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    ports:
      - 27017:27017

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env.example
    depends_on:
      - mongo
    ports:
      - 4000:4000

volumes:
  mongodata:
